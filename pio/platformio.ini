; exskel, PlatformIO (pioarduino) build: Arduino core rebuilt with light sleep enabled.
; The Arduino IDE sketch one folder up is the old build (no light sleep).

[platformio]
boards_dir = .

[env:exskel]
; Local copy of pioarduino 55.03.312-1 (Arduino 3.3.12), engines relaxed to >=6.1.19:
; this Core reports 6.2.0.post1, which the version check ranks below 6.2.0.
platform = file://C:/Users/sammy/Documents/Arduino/exskel/pio/platform
framework = arduino
board = nologo_esp32c3_super_mini
upload_port = COM8
monitor_port = COM8
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
; Rebuilds the core with automatic light sleep (precompiled Arduino core has all of these off).
; Super Mini has no 32 kHz crystal: BLE sleep clock = main XTAL, kept powered in light sleep.
; USJ: no light sleep while USB is plugged in, so Serial/upload keep working.
custom_sdkconfig =
  CONFIG_PM_ENABLE=y
  CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
  CONFIG_BT_CTRL_MODEM_SLEEP=y
  CONFIG_BT_CTRL_MODEM_SLEEP_MODE_1=y
  CONFIG_BT_CTRL_LPCLK_SEL_MAIN_XTAL=y
  CONFIG_BT_CTRL_MAIN_XTAL_PU_DURING_LIGHT_SLEEP=y
  CONFIG_USJ_NO_AUTO_LS_ON_CONNECTION=y
; Same library versions as the Arduino IDE install
lib_deps =
  symlink://C:/Users/sammy/Documents/Arduino/libraries/NimBLE-Arduino
  symlink://C:/Users/sammy/Documents/Arduino/libraries/Adafruit_SSD1306
  symlink://C:/Users/sammy/Documents/Arduino/libraries/Adafruit_GFX_Library
  symlink://C:/Users/sammy/Documents/Arduino/libraries/Adafruit_BusIO
  symlink://C:/Users/sammy/Documents/Arduino/libraries/PMW3360_Module
